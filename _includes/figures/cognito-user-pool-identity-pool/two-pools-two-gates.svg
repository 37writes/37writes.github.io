<svg class="diagram-svg diagram-tall" viewBox="0 0 360 720" role="img" aria-labelledby="cognito-gates-title cognito-gates-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="cognito-gates-title">로그인한 브라우저가 Cognito 두 풀, 정책 맞추기 함수, AWS IoT Core를 차례로 직접 부르는 흐름</title>
  <desc id="cognito-gates-desc">왼쪽 세로 띠는 브라우저이고, 오른쪽 네 단계를 브라우저가 하나씩 직접 부르고 응답을 받는다. 1단계, 브라우저가 이메일과 비밀번호로 사용자 풀에 로그인하고 sub와 cognito:groups가 든 ID 토큰을 받는다. 2단계, 브라우저가 그 ID 토큰을 자격 증명 풀에 내고 자격 증명 ID와 1시간짜리 STS 임시 자격 증명을 받는다. 3단계, 브라우저가 그 자격 증명으로 SigV4 서명을 해 정책 맞추기 함수를 부르고, 함수는 그룹을 보고 그 자격 증명 ID의 IoT 정책을 맞춘다. 4단계, 브라우저가 MQTT over WebSocket과 SigV4로 IoT Core에 직접 연결한다. IoT Core는 로그인 사용자 공통 상한선인 IAM 역할의 허용과, 자격 증명 ID마다 다른 IoT 정책의 허용을 둘 다 확인하고, 둘 다 허용할 때만 통과시키며 하나라도 없으면 거부한다.</desc>
  <rect class="d-box" x="12" y="12" width="84" height="696"/>
  <text class="d-strong" x="54" y="44" text-anchor="middle">브라우저</text>
  <text class="d-small" x="54" y="70" text-anchor="middle">각 단계를</text>
  <text class="d-small" x="54" y="88" text-anchor="middle">직접 호출</text>

  <path class="d-line" d="M96 62 H132"/>
  <path class="d-line" d="M126 57 L132 62 L126 67"/>
  <path class="d-line" d="M102 57 L96 62 L102 67"/>
  <rect class="d-box" x="132" y="12" width="216" height="100"/>
  <text class="d-strong" x="240" y="40" text-anchor="middle">① 사용자 풀</text>
  <text class="d-muted" x="240" y="66" text-anchor="middle">로그인 → ID 토큰</text>
  <text class="d-mono" x="240" y="92" text-anchor="middle">sub · cognito:groups</text>

  <path class="d-line" d="M96 186 H132"/>
  <path class="d-line" d="M126 181 L132 186 L126 191"/>
  <path class="d-line" d="M102 181 L96 186 L102 191"/>
  <rect class="d-box" x="132" y="136" width="216" height="100"/>
  <text class="d-strong" x="240" y="164" text-anchor="middle">② 자격 증명 풀</text>
  <text class="d-muted" x="240" y="190" text-anchor="middle">ID 토큰 → 자격 증명 ID</text>
  <text class="d-muted" x="240" y="216" text-anchor="middle">STS 임시 자격 증명 (1시간)</text>

  <path class="d-line" d="M96 310 H132"/>
  <path class="d-line" d="M126 305 L132 310 L126 315"/>
  <path class="d-line" d="M102 305 L96 310 L102 315"/>
  <rect class="d-box" x="132" y="260" width="216" height="100"/>
  <text class="d-strong" x="240" y="288" text-anchor="middle">③ 정책 맞추기 함수</text>
  <text class="d-muted" x="240" y="314" text-anchor="middle">SigV4로 호출</text>
  <text class="d-muted" x="240" y="340" text-anchor="middle">그룹 보고 IoT 정책 조정</text>

  <path class="d-line" d="M96 420 H132"/>
  <path class="d-line" d="M126 415 L132 420 L126 425"/>
  <path class="d-line" d="M102 415 L96 420 L102 425"/>
  <rect class="d-line" x="132" y="384" width="216" height="324" rx="6"/>
  <text class="d-strong" x="240" y="412" text-anchor="middle">④ IoT Core</text>
  <text class="d-muted" x="240" y="438" text-anchor="middle">MQTT · SigV4로 직접 연결</text>
  <rect class="d-box" x="144" y="456" width="192" height="68"/>
  <text class="d-strong" x="240" y="484" text-anchor="middle">IAM 역할 허용?</text>
  <text class="d-muted" x="240" y="510" text-anchor="middle">로그인 사용자 공통 상한</text>
  <text class="d-muted" x="240" y="546" text-anchor="middle">그리고</text>
  <rect class="d-box" x="144" y="562" width="192" height="68"/>
  <text class="d-strong" x="240" y="590" text-anchor="middle">IoT 정책 허용?</text>
  <text class="d-muted" x="240" y="616" text-anchor="middle">자격 증명 ID마다 다름</text>
  <text class="d-strong" x="240" y="662" text-anchor="middle">✓ 둘 다 허용 → 통과</text>
  <text class="d-strong d-accent" x="240" y="690" text-anchor="middle">✗ 하나라도 없으면 거부</text>
</svg>
