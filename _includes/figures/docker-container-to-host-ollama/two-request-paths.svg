<svg class="diagram-svg diagram-wide" viewBox="0 0 480 372" role="img" aria-labelledby="ollama-paths-title ollama-paths-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="ollama-paths-title">Open WebUI 구성의 두 요청 경로와 localhost가 가리키는 대상</title>
  <desc id="ollama-paths-desc">첫 번째 요청은 Windows의 브라우저가 localhost:3000으로 보내고 컨테이너의 Open WebUI 8080 포트에 도착한다. 두 번째 요청은 컨테이너의 Open WebUI가 host.docker.internal의 11434 포트로 보내고 Windows의 Ollama에 도착한다. localhost는 Windows에서는 Windows 자신이어서 Ollama가 응답하고, 컨테이너에서는 컨테이너 자신이어서 11434 포트에 아무것도 없다.</desc>

  <text class="d-strong" x="16" y="26">① 브라우저 → Open WebUI</text>
  <rect class="d-box" x="16" y="42" width="124" height="60" rx="8"/>
  <text x="78" y="67" text-anchor="middle">브라우저</text>
  <text class="d-muted" x="78" y="89" text-anchor="middle">Windows</text>
  <rect class="d-box" x="340" y="42" width="124" height="60" rx="8"/>
  <text x="402" y="67" text-anchor="middle">Open WebUI</text>
  <text class="d-muted" x="402" y="89" text-anchor="middle">컨테이너 :8080</text>
  <path class="d-line" d="M140 72 H338 M330 66 L338 72 L330 78"/>
  <text class="d-mono" x="240" y="62" text-anchor="middle">localhost:3000</text>
  <text class="d-muted" x="240" y="94" text-anchor="middle">8080으로 전달</text>

  <text class="d-strong" x="16" y="142">② Open WebUI → Ollama</text>
  <rect class="d-box" x="16" y="158" width="124" height="60" rx="8"/>
  <text x="78" y="183" text-anchor="middle">Ollama</text>
  <text class="d-muted" x="78" y="205" text-anchor="middle">Windows :11434</text>
  <rect class="d-box" x="340" y="158" width="124" height="60" rx="8"/>
  <text x="402" y="183" text-anchor="middle">Open WebUI</text>
  <text class="d-muted" x="402" y="205" text-anchor="middle">컨테이너</text>
  <path class="d-line" d="M340 188 H142 M150 182 L142 188 L150 194"/>
  <text class="d-mono" x="240" y="178" text-anchor="middle">host.docker.internal</text>
  <text class="d-mono" x="240" y="210" text-anchor="middle">:11434</text>

  <path class="d-line" d="M16 240 H464"/>

  <text class="d-strong" x="16" y="272">localhost가 가리키는 곳</text>
  <rect class="d-box" x="16" y="288" width="216" height="68" rx="8"/>
  <text x="124" y="315" text-anchor="middle">Windows에서는 Windows</text>
  <text class="d-muted" x="124" y="339" text-anchor="middle">✓ :11434에 Ollama 응답</text>
  <rect class="d-box" x="248" y="288" width="216" height="68" rx="8"/>
  <text x="356" y="315" text-anchor="middle">컨테이너에서는 컨테이너</text>
  <text class="d-muted d-accent" x="356" y="339" text-anchor="middle">✗ :11434 연결 실패</text>
</svg>
<svg class="diagram-svg diagram-narrow" viewBox="0 0 320 584" role="img" aria-labelledby="ollama-paths-title-n ollama-paths-desc-n" xmlns="http://www.w3.org/2000/svg">
  <title id="ollama-paths-title-n">Open WebUI 구성의 두 요청 경로와 localhost가 가리키는 대상</title>
  <desc id="ollama-paths-desc-n">첫 번째 요청은 Windows의 브라우저가 localhost:3000으로 보내고 컨테이너의 Open WebUI 8080 포트에 도착한다. 두 번째 요청은 컨테이너의 Open WebUI가 host.docker.internal의 11434 포트로 보내고 Windows의 Ollama에 도착한다. localhost는 Windows에서는 Windows 자신이어서 Ollama가 응답하고, 컨테이너에서는 컨테이너 자신이어서 11434 포트에 아무것도 없다.</desc>

  <text class="d-strong" x="16" y="24">① 브라우저 → Open WebUI</text>
  <rect class="d-box" x="16" y="38" width="288" height="46" rx="8"/>
  <text x="160" y="67" text-anchor="middle">브라우저 · Windows</text>
  <path class="d-line" d="M40 84 V136 M34 128 L40 136 L46 128"/>
  <text class="d-mono" x="56" y="107">localhost:3000</text>
  <text class="d-muted" x="56" y="127">8080으로 전달</text>
  <rect class="d-box" x="16" y="138" width="288" height="46" rx="8"/>
  <text x="160" y="167" text-anchor="middle">Open WebUI · 컨테이너 :8080</text>

  <text class="d-strong" x="16" y="226">② Open WebUI → Ollama</text>
  <rect class="d-box" x="16" y="240" width="288" height="46" rx="8"/>
  <text x="160" y="269" text-anchor="middle">Open WebUI · 컨테이너</text>
  <path class="d-line" d="M40 286 V338 M34 330 L40 338 L46 330"/>
  <text class="d-mono" x="56" y="309">host.docker.internal</text>
  <text class="d-mono" x="56" y="329">:11434</text>
  <rect class="d-box" x="16" y="340" width="288" height="46" rx="8"/>
  <text x="160" y="369" text-anchor="middle">Ollama · Windows :11434</text>

  <path class="d-line" d="M16 408 H304"/>

  <text class="d-strong" x="16" y="440">localhost가 가리키는 곳</text>
  <rect class="d-box" x="16" y="454" width="288" height="56" rx="8"/>
  <text x="160" y="477" text-anchor="middle">Windows에서는 Windows</text>
  <text class="d-muted" x="160" y="498" text-anchor="middle">✓ :11434에 Ollama 응답</text>
  <rect class="d-box" x="16" y="520" width="288" height="56" rx="8"/>
  <text x="160" y="543" text-anchor="middle">컨테이너에서는 컨테이너</text>
  <text class="d-muted d-accent" x="160" y="564" text-anchor="middle">✗ :11434 연결 실패</text>
</svg>
