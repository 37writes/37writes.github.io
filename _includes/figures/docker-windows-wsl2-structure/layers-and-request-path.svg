<svg class="diagram-svg diagram-tall" viewBox="0 0 360 588" role="img" aria-labelledby="docker-wsl2-layers-title docker-wsl2-layers-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="docker-wsl2-layers-title">Windows의 docker 요청이 WSL2의 Docker Engine에 도달하는 경로</title>
  <desc id="docker-wsl2-layers-desc">요청 경로: Windows PC의 PowerShell에서 실행한 docker 명령은 named pipe로 Docker Desktop 백엔드에 요청을 보내고, 요청은 WSL2 VM 안 docker-desktop 배포판의 Docker Engine에 도달한다. 실행 관계: 요청과 별개로 Docker Engine은 컨테이너 open-webui를 실행하고 관리한다. WSL2 VM의 배포판들은 Linux 커널 하나를 함께 쓴다. Ubuntu-22.04 배포판은 Stopped 상태이며 요청 경로에 들어 있지 않다. 맨 아래에는 VM을 실행하는 바탕인 하이퍼바이저가 있다.</desc>

  <rect class="d-line" x="6" y="6" width="348" height="576" rx="12"/>
  <text class="d-strong" x="22" y="34">Windows PC</text>

  <rect class="d-box" x="22" y="48" width="316" height="50" rx="8"/>
  <text x="180" y="78" text-anchor="middle">PowerShell의 docker 명령</text>

  <path class="d-line" d="M300 98 V130 M294 123 L300 130 L306 123"/>
  <text class="d-muted" x="288" y="119" text-anchor="end">named pipe로 요청</text>

  <rect class="d-box" x="22" y="130" width="316" height="50" rx="8"/>
  <text x="180" y="160" text-anchor="middle">Docker Desktop 백엔드</text>

  <rect class="d-line" x="22" y="214" width="316" height="302" rx="10"/>
  <text class="d-strong" x="38" y="240">WSL2 VM</text>
  <text class="d-muted" x="38" y="262">Linux 커널 하나를 함께 씀</text>

  <rect class="d-line" x="34" y="276" width="292" height="154" rx="8"/>
  <text class="d-mono" x="46" y="300">docker-desktop</text>
  <text class="d-muted" x="182" y="300">Running</text>

  <path class="d-line" d="M300 180 V312 M294 305 L300 312 L306 305"/>

  <rect class="d-box" x="46" y="312" width="268" height="42" rx="6"/>
  <text x="180" y="338" text-anchor="middle">Docker Engine</text>

  <path class="d-line" d="M180 354 V382 M174 375 L180 382 L186 375"/>
  <text class="d-muted" x="192" y="374">실행·관리</text>

  <rect class="d-box" x="46" y="382" width="268" height="40" rx="6"/>
  <text x="180" y="407" text-anchor="middle">컨테이너: open-webui</text>

  <rect class="d-line" x="34" y="442" width="292" height="62" rx="8" stroke-dasharray="5 4"/>
  <text class="d-mono" x="46" y="466">Ubuntu-22.04</text>
  <text class="d-muted" x="164" y="466">Stopped</text>
  <text class="d-muted" x="46" y="490">요청 경로 밖, 꺼져 있어도 된다</text>

  <rect class="d-box" x="22" y="528" width="316" height="42" rx="8"/>
  <text x="180" y="554" text-anchor="middle">하이퍼바이저: VM을 실행하는 바탕</text>
</svg>
