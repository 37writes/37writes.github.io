  <circle class="d-dot" cx="320" cy="186" r="4"/>
  <circle class="d-accent" cx="344" cy="100" r="4"/>
  <circle class="d-accent" cx="358" cy="100" r="4"/>
  <circle class="d-accent" cx="372" cy="100" r="4"/>
  <circle class="d-accent" cx="386" cy="100" r="4"/>
  <circle class="d-accent" cx="400" cy="100" r="4"/>
  <circle class="d-accent" cx="414" cy="100" r="4"/>
  <circle class="d-accent" cx="428" cy="100" r="4"/>
  <circle class="d-accent" cx="442" cy="100" r="4"/>
  <circle class="d-accent" cx="456" cy="100" r="4"/>
  <text class="d-muted" x="54" y="170">정상 ≈ 0.1초</text>
  <text class="d-muted" x="456" y="84" text-anchor="end">2.9초씩 늦음</text>
  <path class="d-line" d="M338 214 V220 H462 V214"/>
  <text x="400" y="238" text-anchor="middle">최근 25개 ≈ 5초</text>
  <path class="d-line" d="M48 254 V260 H462 V254"/>
  <text x="255" y="278" text-anchor="middle">최근 60초</text>
  <text class="d-muted" x="12" y="310">✗ 25개 창: 시계차 2초(상한) → 나이 0.9초 '수신 중'</text>
  <text class="d-accent" x="12" y="336">✓ 60초 창: 시계차 0.1초 → 나이 2.8초 '위치 늦음'</text>
</svg>
