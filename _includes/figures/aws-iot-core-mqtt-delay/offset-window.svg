<svg class="diagram-svg diagram-wide" viewBox="0 0 480 348" role="img" aria-labelledby="ow-title ow-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="ow-title">정상 표본이 남은 60초 창은 짧은 밀림을 덜 흡수한다(개념도)</title>
  <desc id="ow-desc">개념도이며 가로축 길이는 실제 시간에 비례하지 않는다. 가로는 시간, 세로는 메시지마다 받은 시각에서 ts를 뺀 값이다. 왼쪽 긴 구간에는 약 0.1초인 정상 표본이, 오른쪽 끝 약 5초에는 2.9초씩 늦게 온 표본이 있다. 최근 25개 창(약 5초)에는 늦은 표본만 들어 있어 최솟값 2.9초가 상한 2초에 걸리고, 시계차가 2초가 되어 2.9초 늦은 위치의 나이를 0.9초로 계산해 수신 중으로 보인다. 최근 60초 창에는 정상 표본이 남아 시계차가 약 0.1초이고, 나이를 2.8초로 계산해 위치 늦음으로 보인다. 60초 창 전체가 밀리면 이 창도 밀림을 시계차로 흡수한다.</desc>

  <text class="d-muted" x="12" y="24">받은 시각 − ts</text>
  <text class="d-muted" x="468" y="24" text-anchor="end">시간 →</text>
  <text class="d-muted" x="468" y="56" text-anchor="end">개념도 · 시간축 비례 아님</text>
  <path class="d-line" d="M40 200 H468"/>
  <path class="d-line" d="M40 40 V200"/>
  <circle class="d-dot" cx="54" cy="186" r="4"/>
  <circle class="d-dot" cx="68" cy="186" r="4"/>
