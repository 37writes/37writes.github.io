  <path class="d-line" d="M236 66 H256"/>
  <path class="d-line" d="M251 61 L256 66 L251 71"/>
  <rect class="d-box" x="256" y="44" width="124" height="44" rx="6"/><rect class="d-line" x="256" y="44" width="124" height="44" rx="6"/>
  <rect class="d-line" x="264" y="54" width="18" height="24" rx="2"/>
  <rect class="d-line" x="286" y="54" width="18" height="24" rx="2"/>
  <rect class="d-line" x="308" y="54" width="18" height="24" rx="2"/>
  <rect class="d-line" x="330" y="54" width="18" height="24" rx="2"/>
  <rect class="d-line" x="352" y="54" width="18" height="24" rx="2"/>
  <text class="d-muted" x="318" y="108" text-anchor="middle">송신 버퍼 가득</text>
  <text class="d-muted" x="318" y="128" text-anchor="middle">약 130 KB</text>
  <path class="d-line" stroke-dasharray="4 4" d="M380 66 H404"/>
  <text class="d-strong d-accent" x="418" y="73" text-anchor="middle">✗</text>
  <text x="434" y="71">막힘</text>
  <text class="d-muted" x="446" y="108" text-anchor="middle">망 구간</text>
  <text class="d-muted" x="12" y="156">길이 열려도 줄 맨 앞의 옛 위치부터 나간다</text>
  <text class="d-strong d-accent" x="12" y="182">✗ 77초 전 위치가 '지금'으로 도착</text>
  <path class="d-line" d="M12 202 H468"/>
  <text class="d-strong" x="12" y="230">고친 뒤: 최신 것만</text>
  <rect class="d-box" x="12" y="248" width="56" height="44" rx="6"/><rect class="d-line" x="12" y="248" width="56" height="44" rx="6"/>
  <text x="40" y="275" text-anchor="middle">장치</text>
  <path class="d-line" d="M68 270 H88"/>
  <path class="d-line" d="M83 265 L88 270 L83 275"/>
  <rect class="d-box" x="88" y="248" width="64" height="44" rx="6"/><rect class="d-line" x="88" y="248" width="64" height="44" rx="6"/>
  <rect class="d-line" x="111" y="258" width="18" height="24" rx="2"/>
  <text class="d-muted" x="120" y="312" text-anchor="middle">칸 하나</text>
  <path class="d-line" d="M152 270 H172"/>
  <path class="d-line" d="M167 265 L172 270 L167 275"/>
  <rect class="d-box" x="172" y="248" width="124" height="44" rx="6"/><rect class="d-line" x="172" y="248" width="124" height="44" rx="6"/>
  <rect class="d-line" x="180" y="258" width="18" height="24" rx="2"/>
  <rect class="d-line" x="202" y="258" width="18" height="24" rx="2"/>
  <text class="d-muted" x="234" y="312" text-anchor="middle">송신 버퍼</text>
  <text class="d-muted" x="234" y="332" text-anchor="middle">몇 KB 이하</text>
  <path class="d-line" d="M296 270 H320"/>
  <path class="d-line" d="M315 265 L320 270 L315 275"/>
  <text x="328" y="276">망 → 브로커</text>
  <path class="d-line" d="M40 292 V348 H54"/>
  <text class="d-muted" x="62" y="353">앞 것이 안 나갔거나 송신 버퍼가 몇 KB를 넘으면</text>
  <text class="d-muted" x="62" y="373">새 위치는 넘기기 전에 버림</text>
  <text class="d-strong d-accent" x="12" y="404">✓ 길이 열리면 최신 관측으로 빨리 돌아옴</text>
  <text class="d-muted" x="12" y="428">이미 넘긴 소량의 옛 데이터는 먼저 도착할 수 있음</text>
</svg>
