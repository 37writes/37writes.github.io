<svg class="diagram-svg diagram-wide" viewBox="0 0 480 440" role="img" aria-labelledby="tq-title tq-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="tq-title">보내는 쪽 두 겹의 줄: 고치기 전과 최신 것만 보내기로 고친 뒤</title>
  <desc id="tq-desc">고치기 전에는 장치가 만든 위치가 paho 나가는 큐(QoS 0이라 한도 없음)와 커널 송신 버퍼(약 130 KB까지 가득) 두 곳에 줄을 선다. 망이 막히면 줄이 길어지고, 길이 열려도 맨 앞의 옛 위치부터 나가서 77초 전 위치가 지금 것처럼 도착한다. 고친 뒤에는 토픽마다 넘길 칸이 하나뿐이고 송신 버퍼는 몇 KB 이하로 유지된다. 같은 토픽의 앞 메시지가 아직 소켓에 다 써지지 않았거나 송신 버퍼에 확인 안 된 바이트가 몇 KB를 넘으면 새 위치는 넘기기 전에 버린다. 그래서 적체가 작아 길이 열린 뒤 최신 관측으로 빨리 돌아온다. 이미 넘긴 소량의 옛 데이터는 먼저 도착할 수 있다.</desc>

  <text class="d-strong" x="12" y="26">고치기 전</text>
  <rect class="d-box" x="12" y="44" width="56" height="44" rx="6"/><rect class="d-line" x="12" y="44" width="56" height="44" rx="6"/>
  <text x="40" y="71" text-anchor="middle">장치</text>
  <path class="d-line" d="M68 66 H88"/>
  <path class="d-line" d="M83 61 L88 66 L83 71"/>
  <rect class="d-box" x="88" y="44" width="148" height="44" rx="6"/><rect class="d-line" x="88" y="44" width="148" height="44" rx="6"/>
  <rect class="d-line" x="96" y="54" width="18" height="24" rx="2"/>
