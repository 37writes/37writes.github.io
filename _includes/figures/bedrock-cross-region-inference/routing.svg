<svg class="diagram-svg diagram-tall" viewBox="0 0 360 616" role="img" aria-labelledby="bcri-route-title bcri-route-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="bcri-route-title">서울 엔드포인트로 보낸 Bedrock 요청이 모델 ID에 따라 처리되는 곳</title>
  <desc id="bcri-route-desc">앱은 늘 서울(원본 리전)의 bedrock-runtime 엔드포인트로 요청을 보낸다. 접두사 없는 모델 ID(anthropic.claude-sonnet-5)는 In-Region이라 서울 한 곳에서 처리된다. apac. 프로필은 Geographic이라 APAC 안의 목적지 리전 중 하나에서 처리된다. global. 프로필은 Global이라 지원되는 전 세계 상용 리전 중 하나에서 처리된다. 세 갈래가 모든 모델에 다 있는 것은 아니며, 정확한 목적지는 원본 리전에서 프로필을 조회해 확인한다. 교차 리전 갈래에서도 CloudTrail 이벤트와 CloudWatch 지표는 서울에서 확인하고, 실제 처리 리전은 CloudTrail의 inferenceRegion 필드에 남으며, 남용 탐지용으로 저장하는 모델이면 입력과 출력은 목적지 리전에 저장될 수 있다.</desc>

  <rect class="d-box" x="8" y="8" width="344" height="100"/>
  <text class="d-strong" x="180" y="38" text-anchor="middle">앱이 요청을 보내는 곳</text>
  <text class="d-mono" x="180" y="66" text-anchor="middle">bedrock-runtime (서울)</text>
  <text class="d-muted" x="180" y="92" text-anchor="middle">원본 리전 ap-northeast-2</text>

  <path class="d-line" d="M28 108 V400"/>
  <path class="d-line" d="M28 176 H48 M28 288 H48 M28 400 H48"/>
  <path class="d-line" d="M42 171 L48 176 L42 181 M42 283 L48 288 L42 293 M42 395 L48 400 L42 405"/>

  <rect class="d-box" x="48" y="128" width="304" height="96"/>
  <text class="d-mono" x="64" y="156">anthropic.claude-sonnet-5</text>
  <text class="d-muted" x="64" y="182">In-Region (접두사 없음)</text>
  <text x="64" y="208">처리: 서울 한 곳</text>

  <rect class="d-box" x="48" y="240" width="304" height="96"/>
  <text class="d-mono" x="64" y="268">apac.&lt;모델&gt;</text>
  <text class="d-muted" x="64" y="294">Geographic</text>
  <text x="64" y="320">처리: APAC 안 목적지 리전 중 하나</text>

  <rect class="d-box" x="48" y="352" width="304" height="96"/>
  <text class="d-mono" x="64" y="380">global.&lt;모델&gt;</text>
  <text class="d-muted" x="64" y="406">Global</text>
  <text x="64" y="432">처리: 지원되는 전 세계 상용 리전 중 하나</text>

  <rect class="d-box" x="8" y="472" width="344" height="136"/>
  <text class="d-strong" x="180" y="502" text-anchor="middle">교차 리전 갈래에서도</text>
  <text x="180" y="530" text-anchor="middle">기록(CloudTrail·CloudWatch): 서울</text>
  <text x="180" y="558" text-anchor="middle">처리 리전: <tspan class="d-mono">inferenceRegion</tspan> 필드</text>
  <text class="d-accent" x="180" y="586" text-anchor="middle">남용 탐지용으로 보관할 때: 목적지 리전</text>
</svg>
