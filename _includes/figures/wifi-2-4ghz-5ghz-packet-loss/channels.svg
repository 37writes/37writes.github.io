<svg class="diagram-svg diagram-wide" viewBox="0 0 480 372" role="img" aria-labelledby="ch-title ch-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="ch-title">2.4 GHz 채널이 겹치는 모습과 2.4 GHz·5 GHz의 겹치지 않는 20 MHz 채널 수 예</title>
  <desc id="ch-desc">2.4 GHz 채널 1번부터 13번까지 중심이 5 MHz씩 떨어져 있지만 한 채널은 약 20 MHz를 차지해 이웃 채널과 크게 겹친다. 1번, 6번, 11번은 서로 25 MHz 떨어져 겹치지 않아 널리 쓰는 비중첩 채널 계획이다. 아래는 겹치지 않는 20 MHz 채널 수의 예로, 2.4 GHz는 3개, 5 GHz는 Meraki 문서의 미국 채널 계획 예에서 23개다. 5 GHz 개수는 나라·장비·DFS에 따라 다르다.</desc>

  <text class="d-strong" x="240" y="28" text-anchor="middle">2.4 GHz: 널리 쓰는 비중첩 채널 1 · 6 · 11</text>
