<svg class="diagram-svg diagram-wide" viewBox="0 0 480 324" role="img" aria-labelledby="hol-title hol-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="hol-title">TCP에서 메시지 하나가 사라지면 뒤의 메시지까지 멈췄다가 한꺼번에 넘어가는 모습</title>
  <desc id="hol-desc">보내는 쪽이 200 ms마다 메시지 1부터 5를 보낸다. 1과 2는 도착해 바로 앱에 넘어간다. 3은 가는 길에 사라진다. 4와 5는 받는 쪽 TCP에 도착하지만 3이 비어 있어 앱에 넘어가지 못하고 기다린다. 보내는 쪽이 3을 다시 보내 도착하면 TCP가 3, 4, 5를 한꺼번에 앱에 넘긴다. 앱은 2를 받은 뒤 한동안 새 위치를 받지 못해 아이콘이 멈추고, 그다음 세 위치를 거의 동시에 받아 아이콘이 앞으로 뛴다.</desc>

  <text class="d-muted" x="12" y="65">보낸 쪽</text>
  <text class="d-muted" x="12" y="155">받는 쪽 TCP</text>
  <text class="d-muted" x="12" y="245">앱(화면)</text>
  <path class="d-line" d="M112 60 H468"/>
  <path class="d-line" d="M112 150 H468"/>
  <path class="d-line" d="M112 240 H468"/>
  <path class="d-line" d="M130 42 V46 H182 V42"/>
  <text class="d-muted" x="156" y="34" text-anchor="middle">200 ms</text>
  <text class="d-muted d-small" x="468" y="34" text-anchor="end">시간 →</text>
  <text class="d-muted" x="392" y="38" text-anchor="middle">재전송</text>
  <path class="d-line" d="M130 72 L150 138"/>
  <path class="d-line" d="M182 72 L202 138"/>
  <path class="d-line" stroke-dasharray="4 4" d="M234 72 L242 96"/>
  <text class="d-strong d-accent" x="244" y="112" text-anchor="middle">✗</text>
  <path class="d-line" d="M286 72 L306 138"/>
  <path class="d-line" d="M338 72 L358 138"/>
  <path class="d-line" d="M392 72 L412 138"/>
  <circle class="d-box" cx="130" cy="60" r="11"/><circle class="d-line" cx="130" cy="60" r="11"/>
  <text x="130" y="65" text-anchor="middle">1</text>
  <circle class="d-box" cx="182" cy="60" r="11"/><circle class="d-line" cx="182" cy="60" r="11"/>
  <text x="182" y="65" text-anchor="middle">2</text>
  <circle class="d-box" cx="234" cy="60" r="11"/><circle class="d-line" cx="234" cy="60" r="11"/>
  <text x="234" y="65" text-anchor="middle">3</text>
  <circle class="d-box" cx="286" cy="60" r="11"/><circle class="d-line" cx="286" cy="60" r="11"/>
  <text x="286" y="65" text-anchor="middle">4</text>
  <circle class="d-box" cx="338" cy="60" r="11"/><circle class="d-line" cx="338" cy="60" r="11"/>
  <text x="338" y="65" text-anchor="middle">5</text>
  <circle class="d-box" cx="392" cy="60" r="11"/><circle class="d-line" cx="392" cy="60" r="11"/>
  <text x="392" y="65" text-anchor="middle">3</text>
  <circle class="d-box" cx="150" cy="150" r="11"/><circle class="d-line" cx="150" cy="150" r="11"/>
  <text x="150" y="155" text-anchor="middle">1</text>
  <circle class="d-box" cx="202" cy="150" r="11"/><circle class="d-line" cx="202" cy="150" r="11"/>
  <text x="202" y="155" text-anchor="middle">2</text>
  <circle class="d-box" cx="306" cy="150" r="11"/><circle class="d-line" cx="306" cy="150" r="11"/>
  <text x="306" y="155" text-anchor="middle">4</text>
  <circle class="d-box" cx="358" cy="150" r="11"/><circle class="d-line" cx="358" cy="150" r="11"/>
  <text x="358" y="155" text-anchor="middle">5</text>
  <circle class="d-box" cx="412" cy="150" r="11"/><circle class="d-line" cx="412" cy="150" r="11"/>
  <text x="412" y="155" text-anchor="middle">3</text>
  <text class="d-muted" x="332" y="182" text-anchor="middle">3이 없어 4·5 대기</text>
  <path class="d-line" d="M150 162 V228"/>
  <path class="d-line" d="M145 222 L150 228 L155 222"/>
