  <circle class="d-box" cx="150" cy="240" r="11"/><circle class="d-line" cx="150" cy="240" r="11"/>
  <text x="150" y="245" text-anchor="middle">1</text>
  <circle class="d-box" cx="202" cy="240" r="11"/><circle class="d-line" cx="202" cy="240" r="11"/>
  <text x="202" y="245" text-anchor="middle">2</text>
  <circle class="d-box" cx="412" cy="240" r="11"/><circle class="d-line" cx="412" cy="240" r="11"/>
  <text x="412" y="245" text-anchor="middle">3</text>
  <circle class="d-box" cx="436" cy="240" r="11"/><circle class="d-line" cx="436" cy="240" r="11"/>
  <text x="436" y="245" text-anchor="middle">4</text>
  <circle class="d-box" cx="460" cy="240" r="11"/><circle class="d-line" cx="460" cy="240" r="11"/>
  <text x="460" y="245" text-anchor="middle">5</text>
  <path class="d-line" d="M214 256 V262 H400 V256"/>
  <text class="d-muted" x="307" y="284" text-anchor="middle">멈춤: 새 위치가 안 옴</text>
  <text class="d-strong d-accent" x="468" y="310" text-anchor="end">한꺼번에 받음 → 아이콘이 뜀</text>
</svg>
