<svg class="diagram-svg diagram-tall" viewBox="0 0 360 720" role="img" aria-labelledby="cts-flow-title cts-flow-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="cts-flow-title">Transaction Search를 켠 뒤 span이 흐르는 길과 네 가지 설정이 걸리는 자리</title>
  <desc id="cts-flow-desc">에이전트나 앱이 작업마다 span을 만든다. 앱과 SDK 쪽의 표본 규칙이 어떤 요청을 기록할지 정한다. 기록된 span은 PutTraceSegments나 OTLP로 X-Ray가 받는다. 목적지를 CloudWatchLogs로 바꾸고 리소스 정책으로 X-Ray가 로그 그룹에 쓰도록 허락하면, span이 CloudWatch Logs의 aws/spans 로그 그룹에 전부 쌓이고 Transaction Search로 검색된다. 색인 규칙은 그중 일부, 예를 들어 1%만 X-Ray trace summary로 만들어 trace 검색·분석·Insights에 쓴다. 점선 갈래: 지원 리전의 새 AgentCore 에이전트는 aws/spans 대신 에이전트 로그 그룹의 spans 스트림으로 span을 받으며, 이 길도 Transaction Search가 켜져 있어야 한다.</desc>

  <rect class="d-box" x="8" y="8" width="320" height="68"/>
  <text class="d-strong" x="168" y="36" text-anchor="middle">에이전트 · 앱</text>
  <text class="d-muted" x="168" y="62" text-anchor="middle">작업마다 span을 만든다</text>

  <path class="d-line" d="M36 76 V140"/>
  <path class="d-line" d="M31 134 L36 140 L41 134"/>
  <text x="56" y="102" font-weight="700">표본 규칙 (앱·SDK 쪽)</text>
  <text class="d-muted" x="56" y="124">이 요청을 기록할지 정한다</text>

  <rect class="d-box" x="8" y="140" width="320" height="68"/>
  <text class="d-strong" x="168" y="168" text-anchor="middle">X-Ray 수신</text>
  <text class="d-mono" x="168" y="194" text-anchor="middle">PutTraceSegments · OTLP</text>

  <path class="d-line" d="M36 208 V332"/>
  <path class="d-line" d="M31 326 L36 332 L41 326"/>
  <text x="56" y="234" font-weight="700">목적지 → <tspan class="d-mono">CloudWatchLogs</tspan></text>
  <text class="d-muted" x="56" y="256">X-Ray 저장소 대신 Logs로</text>
  <text x="56" y="288" font-weight="700">리소스 정책</text>
  <text class="d-muted" x="56" y="310">X-Ray → 로그 그룹 쓰기 허락</text>

  <rect class="d-box" x="8" y="332" width="320" height="88"/>
  <text class="d-strong" x="168" y="360" text-anchor="middle">CloudWatch Logs</text>
  <text class="d-mono" x="168" y="386" text-anchor="middle">aws/spans</text>
  <text class="d-muted" x="168" y="408" text-anchor="middle">받은 span 전부 · Transaction Search</text>

  <path class="d-line" d="M36 420 V500"/>
  <path class="d-line" d="M31 494 L36 500 L41 494"/>
  <text x="56" y="446" font-weight="700">색인 규칙</text>
  <text class="d-muted" x="56" y="468">받은 것 중 일부(예: 1%)만</text>

  <rect class="d-box" x="8" y="500" width="320" height="68"/>
  <text class="d-strong" x="168" y="528" text-anchor="middle">X-Ray trace summary</text>
  <text class="d-muted" x="168" y="554" text-anchor="middle">trace 검색 · 분석 · Insights</text>

  <path class="d-line" d="M328 174 H346 V656 H330" stroke-dasharray="5 4"/>
  <path class="d-line" d="M336 651 L330 656 L336 661"/>
  <rect class="d-line" x="8" y="600" width="320" height="112" rx="4" stroke-dasharray="5 4"/>
  <text x="168" y="628" text-anchor="middle">AgentCore 새 에이전트 (지원 리전)</text>
  <text class="d-muted" x="168" y="652" text-anchor="middle"><tspan class="d-mono">aws/spans</tspan> 대신 에이전트 로그 그룹의</text>
  <text class="d-muted" x="168" y="676" text-anchor="middle"><tspan class="d-mono">spans</tspan> 스트림으로</text>
  <text class="d-muted" x="168" y="700" text-anchor="middle">이 길도 Transaction Search가 전제</text>
</svg>
