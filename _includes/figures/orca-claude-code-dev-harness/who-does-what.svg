<svg class="diagram-svg diagram-tall" viewBox="0 0 360 486" role="img" aria-labelledby="orca-fig-title orca-fig-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="orca-fig-title">누가 어떤 역할을 맡나: 나, 대화 세션, Orca 워커</title>
  <desc id="orca-fig-desc">나(사람)는 Plan Reviewer로 T2 작업의 계획을 승인하거나 수정을 요청한다. 내가 대화하는 Claude Code 세션 하나가 Coordinator, Planner, Supervisor, Tracker를 번갈아 맡는다. 세션은 Orca 워커에게 대화 전체 대신 작업 카드를 주고, 워커는 끝나면 worker_done 메시지로 정해진 양식의 보고를 돌려준다. 워커는 각자 자기 git worktree에서 일하며 Coder는 구현과 커밋, Validator는 처음부터 재검증을 맡는다. Reporter는 문서를 갱신하며 워커 또는 대화 세션이 맡는다. Validator는 Coder와 다른 에이전트가 맡는다. 등급은 T0는 바로 처리, T1은 계획 카드와 독립 검증, T2는 여기에 실행 전 사람 승인을 더한다.</desc>
  <rect class="d-box" x="12" y="12" width="336" height="60"/>
  <text class="d-strong" x="28" y="38">나 (사람)</text>
  <text class="d-muted" x="28" y="60">Plan Reviewer · T2 계획 승인·수정</text>
  <path class="d-line" d="M120 72 V116 M240 72 V116"/>
  <text class="d-muted d-small" x="112" y="99" text-anchor="end">요청·승인 ↓</text>
  <text class="d-muted d-small" x="248" y="99">↑ 계획·결과 보고</text>
  <rect class="d-box" x="12" y="116" width="336" height="88"/>
  <text class="d-strong" x="28" y="142">대화 세션 (Claude Code)</text>
  <text class="d-mono" x="28" y="168">Coordinator · Planner</text>
  <text class="d-mono" x="28" y="190">Supervisor · Tracker</text>
  <path class="d-line" d="M120 204 V248 M240 204 V248"/>
  <text class="d-muted d-small" x="112" y="231" text-anchor="end">작업 카드 ↓</text>
  <text class="d-muted d-small" x="248" y="231">↑ <tspan class="d-mono">worker_done</tspan></text>
  <rect class="d-line" x="4" y="248" width="352" height="142"/>
  <text class="d-strong" x="16" y="276">Orca 워커</text>
  <text class="d-muted" x="344" y="276" text-anchor="end">각자 자기 worktree에서</text>
  <rect class="d-box" x="12" y="292" width="104" height="86"/>
  <text class="d-strong" x="64" y="320" text-anchor="middle">Coder</text>
  <text class="d-muted d-small" x="64" y="344" text-anchor="middle">구현 · 커밋</text>
  <rect class="d-box" x="128" y="292" width="104" height="86"/>
  <text class="d-strong" x="180" y="320" text-anchor="middle">Validator</text>
  <text class="d-muted d-small" x="180" y="344" text-anchor="middle">처음부터</text>
  <text class="d-muted d-small" x="180" y="362" text-anchor="middle">재검증</text>
  <rect class="d-box" x="244" y="292" width="104" height="86"/>
  <text class="d-strong" x="296" y="320" text-anchor="middle">Reporter</text>
  <text class="d-muted d-small" x="296" y="344" text-anchor="middle">문서 갱신</text>
  <text class="d-muted d-small" x="296" y="362" text-anchor="middle">(세션도 가능)</text>
  <text class="d-muted" x="180" y="418" text-anchor="middle">Validator는 Coder와 다른 에이전트</text>
  <path class="d-line" d="M12 438 H348"/>
  <text x="180" y="470" text-anchor="middle">등급: T0 바로 · T1 독립 검증 · T2 사람 승인</text>
</svg>
