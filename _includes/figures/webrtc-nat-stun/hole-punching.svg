  <rect class="d-line" x="12" y="12" width="336" height="380" rx="6"/>
  <text class="d-strong" x="180.0" y="42" text-anchor="middle">✓ 끝점 독립 매핑</text>
  <text class="d-muted" x="180.0" y="66" text-anchor="middle">예전 이름: 콘 NAT</text>
  <rect class="d-box" x="24" y="82" width="312" height="72"/>
