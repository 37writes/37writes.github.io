  <text class="d-mono" x="180.0" y="136" text-anchor="middle">:40001 <tspan class="d-small">STUN이 알려 준 주소</tspan></text>
  <rect class="d-box" x="24" y="164" width="312" height="72"/>
  <text class="d-muted" x="180.0" y="190" text-anchor="middle">2. A → B (구멍 뚫기)</text>
  <text class="d-mono" x="180.0" y="218" text-anchor="middle">:40001 <tspan class="d-small">같은 바깥 포트</tspan></text>
  <rect class="d-box" x="24" y="246" width="312" height="72"/>
  <text class="d-muted" x="180.0" y="272" text-anchor="middle">3. B → A의 :40001</text>
  <text class="d-small" x="180.0" y="300" text-anchor="middle">B는 STUN 주소로 보낸다</text>
  <text class="d-strong" x="180.0" y="346" text-anchor="middle">✓ 들어간다</text>
  <text class="d-muted" x="180.0" y="370" text-anchor="middle">2에서 B에게 연 그 포트</text>
  <rect class="d-line" x="12" y="404" width="336" height="380" rx="6"/>
  <text class="d-strong d-accent" x="180.0" y="434" text-anchor="middle">✗ 주소·포트 의존 매핑</text>
  <text class="d-muted" x="180.0" y="458" text-anchor="middle">예전 이름: 대칭 NAT</text>
  <rect class="d-box" x="24" y="474" width="312" height="72"/>
  <text class="d-muted" x="180.0" y="500" text-anchor="middle">1. A → STUN 서버</text>
  <text class="d-mono" x="180.0" y="528" text-anchor="middle">:40001 <tspan class="d-small">STUN이 알려 준 주소</tspan></text>
  <rect class="d-box" x="24" y="556" width="312" height="72"/>
  <text class="d-muted" x="180.0" y="582" text-anchor="middle">2. A → B (구멍 뚫기)</text>
  <text class="d-mono" x="180.0" y="610" text-anchor="middle">:40777 <tspan class="d-small">상대마다 새 포트</tspan></text>
  <rect class="d-box" x="24" y="638" width="312" height="72"/>
  <text class="d-muted" x="180.0" y="664" text-anchor="middle">3. B → A의 :40001</text>
  <text class="d-small" x="180.0" y="692" text-anchor="middle">B는 STUN 주소로 보낸다</text>
  <text class="d-strong d-accent" x="180.0" y="738" text-anchor="middle">✗ 버려진다</text>
  <text class="d-muted" x="180.0" y="762" text-anchor="middle">B에게 연 포트는 :40777</text>
</svg>
