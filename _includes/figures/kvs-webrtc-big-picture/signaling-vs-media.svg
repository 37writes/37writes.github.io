<svg class="diagram-svg diagram-wide" viewBox="0 0 480 466" role="img" aria-labelledby="kvsbp-path-title kvsbp-path-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="kvsbp-path-title">시그널링 길과 영상 길이 다른 KVS WebRTC 구조</title>
  <desc id="kvsbp-path-desc">현장 장비는 마스터로 KVS 신호 채널에 먼저 접속해 기다리고, 브라우저는 뷰어로 나중에 접속한다. 둘은 신호 채널의 WSS 연결로 SDP와 ICE 후보 쪽지만 주고받는다(점선). 영상은 신호 채널을 지나지 않고 장비와 브라우저 사이의 직접 길로 흐르거나, 직접 길이 막히면 KVS TURN 중계를 거쳐 흐른다(실선, TURN 상자에만 이어짐). KVS STUN은 따로 떨어진 상자로, 기기에게 바깥에서 보이는 주소만 알려 주고 영상을 나르지 않는다.</desc>
  <rect class="d-box" x="140" y="8" width="200" height="68"/>
  <text class="d-strong" x="240" y="36" text-anchor="middle">KVS 신호 채널</text>
  <text class="d-muted" x="240" y="62" text-anchor="middle">쪽지만 전달, 영상 없음</text>

  <path class="d-line" d="M75 160 V42 H140" stroke-dasharray="6 4"/>
  <path class="d-line" d="M405 160 V42 H340" stroke-dasharray="6 4"/>
  <text x="240" y="112" text-anchor="middle">쪽지: SDP · ICE 후보</text>
  <text class="d-muted" x="240" y="136" text-anchor="middle">WSS 연결로 오감</text>

  <rect class="d-box" x="0" y="160" width="150" height="72"/>
  <text class="d-strong" x="75" y="190" text-anchor="middle">현장 장비</text>
  <text class="d-muted" x="75" y="216" text-anchor="middle">마스터, 먼저 대기</text>
  <rect class="d-box" x="330" y="160" width="150" height="72"/>
  <text class="d-strong" x="405" y="190" text-anchor="middle">브라우저</text>
  <text class="d-muted" x="405" y="216" text-anchor="middle">뷰어, 나중에 접속</text>

  <path class="d-line" d="M150 198 H330"/>
  <text x="240" y="188" text-anchor="middle">영상 직접 (SRTP)</text>

  <path class="d-line" d="M50 232 V304 H140"/>
  <path class="d-line" d="M430 232 V304 H340"/>
  <text class="d-muted" x="58" y="258">또는 중계</text>
  <rect class="d-box" x="140" y="270" width="200" height="68"/>
  <text class="d-strong" x="240" y="298" text-anchor="middle">KVS TURN</text>
  <text x="240" y="324" text-anchor="middle">막히면 영상 중계</text>

  <rect class="d-box" x="140" y="354" width="200" height="68"/>
  <text class="d-strong" x="240" y="382" text-anchor="middle">KVS STUN</text>
  <text class="d-muted" x="240" y="408" text-anchor="middle">바깥 주소만 알려 줌</text>

  <path class="d-line" d="M60 450 H100" stroke-dasharray="6 4"/>
  <text class="d-muted" x="108" y="455">쪽지(시그널링)</text>
  <path class="d-line" d="M260 450 H300"/>
  <text class="d-muted" x="308" y="455">영상(미디어)</text>
</svg>
<svg class="diagram-svg diagram-narrow" viewBox="0 0 360 466" role="img" aria-labelledby="kvsbp-path-title-n kvsbp-path-desc-n" xmlns="http://www.w3.org/2000/svg">
  <title id="kvsbp-path-title-n">시그널링 길과 영상 길이 다른 KVS WebRTC 구조</title>
