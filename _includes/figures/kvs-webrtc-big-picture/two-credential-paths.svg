<svg class="diagram-svg diagram-tall" viewBox="0 0 360 596" role="img" aria-labelledby="kvsbp-cred-title kvsbp-cred-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="kvsbp-cred-title">브라우저와 현장 장비가 KVS용 임시 자격을 받는 두 길</title>
  <desc id="kvsbp-cred-desc">브라우저는 사람이 로그인해 받은 ID 토큰을 Cognito 자격 증명 풀에 내고, 자격 증명 풀이 IAM 역할을 골라 1시간짜리 STS 임시 자격을 준다. 이 뷰어 역할은 보기 동작만 허용하고 ConnectAsMaster는 없다. 현장 장비는 사람이 없으므로 X.509 인증서로 mTLS 연결을 맺어 IoT 자격 증명 공급자에 요청하고, 공급자는 role alias가 가리키는 IAM 역할로 기본 1시간(900~43,200초)짜리 STS 임시 자격을 준다. 이 마스터 역할은 자기 채널만 허용하고 ConnectAsViewer는 없다. 두 길 모두 받은 임시 자격으로 SigV4 서명을 해서 KVS를 부르며, 어느 쪽도 오래 사는 액세스 키를 갖지 않는다.</desc>
  <text class="d-strong" x="86" y="24" text-anchor="middle">브라우저</text>
  <text class="d-muted" x="86" y="48" text-anchor="middle">사람이 로그인</text>
  <text class="d-strong" x="274" y="24" text-anchor="middle">현장 장비</text>
  <text class="d-muted" x="274" y="48" text-anchor="middle">사람이 없음</text>

  <rect class="d-box" x="0" y="64" width="172" height="60"/>
  <text x="86" y="90" text-anchor="middle">ID 토큰</text>
  <text class="d-muted" x="86" y="112" text-anchor="middle">로그인 결과</text>
  <rect class="d-box" x="188" y="64" width="172" height="60"/>
  <text x="274" y="90" text-anchor="middle">X.509 인증서</text>
  <text class="d-muted" x="274" y="112" text-anchor="middle">mTLS로 제시</text>

  <path class="d-line" d="M86 124 V150 M80 143 L86 150 L92 143"/>
  <path class="d-line" d="M274 124 V150 M268 143 L274 150 L280 143"/>

  <rect class="d-box" x="0" y="152" width="172" height="96"/>
  <text class="d-strong" x="86" y="180" text-anchor="middle">Cognito</text>
  <text class="d-strong" x="86" y="204" text-anchor="middle">자격 증명 풀</text>
  <text class="d-muted" x="86" y="230" text-anchor="middle">IAM 역할을 고름</text>
  <rect class="d-box" x="188" y="152" width="172" height="96"/>
  <text class="d-strong" x="274" y="180" text-anchor="middle">IoT 자격 증명</text>
  <text class="d-strong" x="274" y="204" text-anchor="middle">공급자</text>
  <text class="d-muted" x="274" y="230" text-anchor="middle">role alias → 역할</text>

  <path class="d-line" d="M86 248 V274 M80 267 L86 274 L92 267"/>
  <path class="d-line" d="M274 248 V274 M268 267 L274 274 L280 267"/>

  <rect class="d-box" x="0" y="276" width="172" height="84"/>
  <text class="d-strong" x="86" y="304" text-anchor="middle">STS 임시 자격</text>
  <text class="d-muted" x="86" y="330" text-anchor="middle">1시간</text>
  <rect class="d-box" x="188" y="276" width="172" height="84"/>
  <text class="d-strong" x="274" y="304" text-anchor="middle">STS 임시 자격</text>
  <text class="d-muted" x="274" y="328" text-anchor="middle">기본 1시간</text>
  <text class="d-muted" x="274" y="350" text-anchor="middle">900~43,200초</text>

  <path class="d-line" d="M86 360 V386 M80 379 L86 386 L92 379"/>
  <path class="d-line" d="M274 360 V386 M268 379 L274 386 L280 379"/>

  <rect class="d-box" x="0" y="388" width="172" height="96"/>
  <text class="d-strong" x="86" y="416" text-anchor="middle">뷰어 역할</text>
  <text x="86" y="442" text-anchor="middle">✓ 보기 동작만</text>
  <text class="d-mono" x="86" y="468" text-anchor="middle">✗ ConnectAsMaster</text>
  <rect class="d-box" x="188" y="388" width="172" height="96"/>
  <text class="d-strong" x="274" y="416" text-anchor="middle">마스터 역할</text>
  <text x="274" y="442" text-anchor="middle">✓ 자기 채널만</text>
  <text class="d-mono" x="274" y="468" text-anchor="middle">✗ ConnectAsViewer</text>

  <path class="d-line" d="M86 484 V514 M80 507 L86 514 L92 507"/>
  <path class="d-line" d="M274 484 V514 M268 507 L274 514 L280 507"/>

  <rect class="d-box" x="0" y="516" width="360" height="72"/>
  <text class="d-strong" x="180" y="546" text-anchor="middle">SigV4 서명 → KVS</text>
  <text class="d-muted" x="180" y="572" text-anchor="middle">둘 다 오래 사는 액세스 키 없음</text>
</svg>
