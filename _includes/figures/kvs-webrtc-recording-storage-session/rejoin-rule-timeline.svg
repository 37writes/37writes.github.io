<svg class="diagram-svg diagram-tall" viewBox="0 0 360 684" role="img" aria-labelledby="kvs-rejoin-title kvs-rejoin-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="kvs-rejoin-title">JoinStorageSession을 다시 부르는 규칙을 고치기 전과 고친 뒤의 시간 흐름</title>
  <desc id="kvs-rejoin-desc">위쪽은 고치기 전에 이번에 관찰한 흐름이다. 0초에 join을 부르고 offer가 온다. 약 0.7초, offer에 답하는 중에 join을 또 불러 답하던 세션이 버려진다. 약 30초, ICE consent가 만료되고 우리 구현이 이때 연결을 닫는다. RFC 7675가 요구하는 것은 그 경로로 보내기를 멈추는 것까지다. 약 33초, 같은 일이 처음부터 되풀이되어 녹화는 30초 남짓한 조각만 남는다. 아래쪽은 고친 뒤다. 0초에 join을 부르고 offer가 온다. 상대가 있는 동안에는 협상 중이어도 join을 다시 부르지 않는다. 결과로 시험용 마스터를 끌 때까지 약 36분 동안 녹화 하나가 이어졌다. 따로 놓인 상자는 상대가 사라질 경우의 규칙이다. 상대 객체가 없고 마지막 join과 마지막 offer 중 늦은 쪽에서 25초가 지나면 다시 join한다.</desc>
  <text class="d-strong" x="16" y="28">고치기 전 (이번 관찰)</text>
  <text class="d-small" x="16" y="50">약 33초마다 새 세션이 열림</text>
  <path class="d-line" d="M32 70 V284"/>
  <circle class="d-dot" cx="32" cy="80" r="5"/>
  <text x="52" y="86">0초 · join, offer 도착</text>
  <circle class="d-accent" cx="32" cy="132" r="5"/>
  <text class="d-accent" x="52" y="138">약 0.7초 · 답하는 중 또 join</text>
  <text class="d-small" x="52" y="160">답하던 세션이 버려짐</text>
  <circle class="d-dot" cx="32" cy="196" r="5"/>
  <text x="52" y="202">약 30초 · consent 만료</text>
  <text class="d-small" x="52" y="224">우리 구현이 이때 연결을 닫음</text>
  <text class="d-small" x="52" y="244">(RFC 7675의 요구는 송신 중단까지)</text>
  <circle class="d-dot" cx="32" cy="278" r="5"/>
  <text x="52" y="284">약 33초 · 처음부터 되풀이</text>
  <text class="d-small" x="52" y="306">녹화는 30초 남짓한 조각만 남음</text>

  <path class="d-line" d="M8 330 H352"/>

  <text class="d-strong" x="16" y="366">고친 뒤</text>
  <path class="d-line" d="M32 386 V512"/>
  <circle class="d-dot" cx="32" cy="396" r="5"/>
  <text x="52" y="402">0초 · join, offer 도착</text>
  <circle class="d-dot" cx="32" cy="448" r="5"/>
  <text x="52" y="454">상대가 있는 동안</text>
  <text class="d-small" x="52" y="476">→ 협상 중이어도 다시 join 안 함</text>
  <circle class="d-dot" cx="32" cy="512" r="5"/>
  <text class="d-strong" x="52" y="518">약 36분 녹화 하나</text>
  <text class="d-small" x="52" y="540">시험용 마스터를 끌 때까지 이어짐</text>

  <rect class="d-box" x="16" y="568" width="328" height="100" rx="6"/>
  <text x="32" y="596">상대가 사라질 경우의 규칙</text>
  <text class="d-small" x="32" y="622">상대 객체가 없고, 마지막 join·offer 중</text>
  <text class="d-small" x="32" y="644">늦은 쪽에서 25초가 지나면 다시 join</text>
</svg>
