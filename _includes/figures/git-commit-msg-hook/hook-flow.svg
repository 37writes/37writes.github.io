<svg class="diagram-svg diagram-tall" viewBox="0 0 360 468" role="img" aria-labelledby="hook-fig-title hook-fig-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="hook-fig-title">git commit 안에서 commit-msg 훅이 도는 자리</title>
  <desc id="hook-fig-desc">git commit을 실행하면 먼저 메시지 파일 .git/COMMIT_EDITMSG가 만들어지고, 이 파일에는 주석 줄이 그대로 들어 있다. 그다음 commit-msg 훅이 실행되며 첫 번째 인자로 메시지 파일 경로를 받는다. 훅이 exit 0으로 끝나면 주석을 정리하고 커밋을 만든다. 0이 아닌 값으로 끝나면 커밋이 중단되고 훅이 stderr로 쓴 안내가 터미널에 보인다. --no-verify를 주면 훅을 건너뛴다.</desc>
  <rect class="d-box" x="40" y="12" width="280" height="44"/>
  <text class="d-mono" x="180" y="40" text-anchor="middle">git commit</text>
  <path class="d-line" d="M180 56 V76"/>
  <rect class="d-box" x="40" y="76" width="280" height="88"/>
  <text class="d-strong" x="180" y="102" text-anchor="middle">메시지 파일 작성</text>
  <text class="d-mono" x="180" y="126" text-anchor="middle">.git/COMMIT_EDITMSG</text>
  <text class="d-muted" x="180" y="150" text-anchor="middle"># 주석 줄도 그대로 들어 있음</text>
  <path class="d-line" d="M180 164 V184"/>
  <rect class="d-box" x="40" y="184" width="280" height="64"/>
  <text class="d-strong" x="180" y="210" text-anchor="middle">commit-msg 훅 실행</text>
  <text class="d-muted" x="180" y="234" text-anchor="middle">인자 <tspan class="d-mono">$1</tspan> = 메시지 파일 경로</text>
  <path class="d-line" d="M180 248 V264 H92 V280 M180 264 H268 V280"/>
  <text class="d-mono" x="92" y="300" text-anchor="middle">exit 0</text>
  <text class="d-mono" x="268" y="300" text-anchor="middle">exit 1</text>
  <text class="d-muted d-small" x="268" y="320" text-anchor="middle">0이 아닌 값이면</text>
  <rect class="d-box" x="12" y="332" width="160" height="72"/>
  <text x="92" y="360" text-anchor="middle">주석 정리</text>
  <text class="d-strong" x="92" y="388" text-anchor="middle">✓ 커밋 생성</text>
  <rect class="d-box" x="188" y="332" width="160" height="72"/>
  <text class="d-strong d-accent" x="268" y="360" text-anchor="middle">✗ 커밋 중단</text>
  <text class="d-muted" x="268" y="388" text-anchor="middle">훅이 쓴 안내 표시</text>
  <text class="d-muted" x="180" y="448" text-anchor="middle"><tspan class="d-mono">--no-verify</tspan>를 주면 훅을 건너뜀</text>
</svg>
