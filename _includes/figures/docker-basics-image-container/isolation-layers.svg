<svg class="diagram-svg diagram-tall" viewBox="0 0 360 410" role="img" aria-labelledby="dil-title dil-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="dil-title">Docker Desktop WSL2 환경에서 가상환경과 Linux 컨테이너가 놓인 자리</title>
  <desc id="dil-desc">가장 바깥은 Windows이고 그 위에서 Ollama와 Windows의 Python 가상환경 예시가 돈다. Python 가상환경은 패키지만 나눈다. Windows 안의 WSL2 가상 머신에는 Docker Desktop의 Linux 엔진이 있다. 이 엔진의 Linux 컨테이너인 open-webui와 alpine은 배포판이 달라도 같은 Linux 커널을 함께 쓴다.</desc>

  <text class="d-strong" x="180" y="24" text-anchor="middle">'가상'이 나누는 범위가 다르다</text>

  <rect class="d-line" x="6" y="42" width="348" height="360" rx="6"/>
  <text x="22" y="68" font-weight="700">Windows</text>

  <rect class="d-box" x="22" y="82" width="150" height="62" rx="6"/><rect class="d-line" x="22" y="82" width="150" height="62" rx="6"/>
  <text x="97" y="107" text-anchor="middle">Ollama</text>
  <text class="d-muted" x="97" y="130" text-anchor="middle">Windows 프로그램</text>

  <rect class="d-box" x="188" y="82" width="150" height="62" rx="6"/><rect class="d-line" x="188" y="82" width="150" height="62" rx="6"/>
  <text x="263" y="107" text-anchor="middle">Python 가상환경</text>
  <text class="d-muted" x="263" y="130" text-anchor="middle">예시: 패키지만 나눔</text>

  <rect class="d-line" x="22" y="160" width="316" height="228" rx="6"/>
  <text x="38" y="186" font-weight="700">WSL2 가상 머신</text>
  <text class="d-muted" x="38" y="208">Docker Desktop의 Linux 엔진</text>
  <text class="d-muted" x="38" y="234">Linux 컨테이너</text>

  <rect class="d-box" x="38" y="244" width="134" height="62" rx="6"/><rect class="d-line" x="38" y="244" width="134" height="62" rx="6"/>
  <text class="d-mono" x="105" y="269" text-anchor="middle">open-webui</text>
  <text class="d-muted" x="105" y="292" text-anchor="middle">Debian 13</text>

  <rect class="d-box" x="188" y="244" width="134" height="62" rx="6"/><rect class="d-line" x="188" y="244" width="134" height="62" rx="6"/>
  <text class="d-mono" x="255" y="269" text-anchor="middle">alpine</text>
  <text class="d-muted" x="255" y="292" text-anchor="middle">Alpine 3.20</text>

  <path class="d-line" d="M105 306 V328 M255 306 V328"/>
  <rect class="d-box" x="38" y="328" width="284" height="44" rx="6"/><rect class="d-line" x="38" y="328" width="284" height="44" rx="6" stroke-width="3"/>
  <text x="180" y="356" text-anchor="middle" font-weight="700">함께 쓰는 Linux 커널</text>
</svg>
