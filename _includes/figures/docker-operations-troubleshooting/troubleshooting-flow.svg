<svg class="diagram-svg diagram-tall" viewBox="0 0 360 468" role="img" aria-labelledby="docker-flow-title docker-flow-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="docker-flow-title">Docker 문제 해결 순서: 상태, 로그, 내부 접속, 연결, 자원</title>
  <desc id="docker-flow-desc">위에서 아래로 다섯 단계를 확인한다. 1 상태는 compose ps -a로 컨테이너가 실행 중이고 healthy인지 본다. 2 로그는 compose logs로 앱이 남긴 오류를 본다. 3 내부 접속은 컨테이너가 실행 중일 때 exec로 앱의 응답을 본다. 4 연결은 출발지와 도착지를 나눠 Windows에서 WebUI로, 컨테이너에서 Ollama로 가는 길을 curl로 본다. 5 자원은 Docker의 메모리와 디스크를 stats와 system df로, Ollama의 모델 배치를 ollama ps로 나눠 본다.</desc>

  <rect class="d-box" x="1" y="1" width="358" height="66" rx="8"/>
  <text class="d-strong" x="16" y="28">1 상태</text>
  <text class="d-mono" x="344" y="28" text-anchor="end">compose ps -a</text>
  <text class="d-muted" x="16" y="52">실행 중이고 healthy인가?</text>
  <path class="d-line" d="M180 67 V88 M175 82 L180 88 L185 82"/>

  <rect class="d-box" x="1" y="89" width="358" height="66" rx="8"/>
  <text class="d-strong" x="16" y="116">2 로그</text>
  <text class="d-mono" x="344" y="116" text-anchor="end">compose logs</text>
  <text class="d-muted" x="16" y="140">앱이 남긴 오류가 있는가?</text>
  <path class="d-line" d="M180 155 V176 M175 170 L180 176 L185 170"/>

  <rect class="d-box" x="1" y="177" width="358" height="66" rx="8"/>
  <text class="d-strong" x="16" y="204">3 내부 접속</text>
  <text class="d-mono" x="344" y="204" text-anchor="end">exec</text>
  <text class="d-muted" x="16" y="228">컨테이너 안에서 앱이 응답하는가?</text>
  <path class="d-line" d="M180 243 V264 M175 258 L180 264 L185 258"/>

  <rect class="d-box" x="1" y="265" width="358" height="90" rx="8"/>
  <text class="d-strong" x="16" y="292">4 연결</text>
  <text class="d-muted" x="16" y="318">Windows → WebUI</text>
  <text class="d-mono" x="344" y="318" text-anchor="end">curl.exe</text>
  <text class="d-muted" x="16" y="342">컨테이너 → Ollama</text>
  <text class="d-mono" x="344" y="342" text-anchor="end">exec curl</text>
  <path class="d-line" d="M180 355 V376 M175 370 L180 376 L185 370"/>

  <rect class="d-box" x="1" y="377" width="358" height="90" rx="8"/>
  <text class="d-strong" x="16" y="404">5 자원</text>
  <text class="d-muted" x="16" y="430">Docker 메모리·디스크</text>
  <text class="d-mono" x="344" y="430" text-anchor="end">stats · df</text>
  <text class="d-muted" x="16" y="454">Ollama 모델 배치</text>
  <text class="d-mono" x="344" y="454" text-anchor="end">ollama ps</text>
</svg>
