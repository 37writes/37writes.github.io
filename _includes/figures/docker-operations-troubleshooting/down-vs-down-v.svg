  <rect class="d-box" x="1" y="354" width="318" height="34" rx="6"/>
  <text x="13" y="376">이미지</text>
  <text x="307" y="376" text-anchor="end">✓ 남음</text>
  <rect class="d-line" x="1" y="394" width="318" height="34" rx="6"/>
  <text class="d-accent" x="13" y="416">볼륨 (데이터)</text>
  <text class="d-accent" x="307" y="416" text-anchor="end">✗ 삭제</text>
  <text class="d-muted d-accent" x="1" y="452">다시 up 해도 빈 볼륨으로 시작</text>
