<svg class="diagram-svg diagram-wide" viewBox="0 0 480 282" role="img" aria-labelledby="docker-down-title docker-down-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="docker-down-title">이 예제의 Compose 관리 볼륨 기준으로 비교한 docker compose down과 down -v</title>
  <desc id="docker-down-desc">이 예제의 Compose가 관리하는 이름 있는 데이터 볼륨 기준이다. 두 명령 모두 컨테이너와 네트워크를 지우고 이미지는 남긴다. down은 기존 볼륨을 유지해 다시 up 하면 같은 볼륨을 연결한다. down -v는 기존 데이터를 삭제해 다시 up 하면 새 볼륨을 만든다.</desc>

  <text class="d-muted" x="1" y="16">이 예제의 Compose 관리 볼륨 기준</text>

  <text class="d-mono" x="1" y="46">docker compose down</text>
  <rect class="d-line" x="1" y="62" width="226" height="36" rx="6"/>
  <text x="13" y="85">컨테이너</text>
  <text class="d-muted" x="215" y="85" text-anchor="end">✗ 삭제</text>
  <rect class="d-line" x="1" y="104" width="226" height="36" rx="6"/>
  <text x="13" y="127">네트워크</text>
  <text class="d-muted" x="215" y="127" text-anchor="end">✗ 삭제</text>
  <rect class="d-box" x="1" y="146" width="226" height="36" rx="6"/>
  <text x="13" y="169">이미지</text>
  <text x="215" y="169" text-anchor="end">✓ 남음</text>
  <rect class="d-box" x="1" y="188" width="226" height="36" rx="6"/>
  <text x="13" y="211">볼륨 (데이터)</text>
  <text x="215" y="211" text-anchor="end">✓ 남음</text>
  <text class="d-muted" x="1" y="250">기존 볼륨 유지</text>
  <text class="d-muted" x="1" y="272">다시 up: 같은 볼륨을 연결</text>

  <text class="d-mono" x="253" y="46">docker compose down -v</text>
  <rect class="d-line" x="253" y="62" width="226" height="36" rx="6"/>
  <text x="265" y="85">컨테이너</text>
  <text class="d-muted" x="467" y="85" text-anchor="end">✗ 삭제</text>
  <rect class="d-line" x="253" y="104" width="226" height="36" rx="6"/>
  <text x="265" y="127">네트워크</text>
  <text class="d-muted" x="467" y="127" text-anchor="end">✗ 삭제</text>
  <rect class="d-box" x="253" y="146" width="226" height="36" rx="6"/>
  <text x="265" y="169">이미지</text>
  <text x="467" y="169" text-anchor="end">✓ 남음</text>
  <rect class="d-line" x="253" y="188" width="226" height="36" rx="6"/>
  <text class="d-accent" x="265" y="211">볼륨 (데이터)</text>
  <text class="d-accent" x="467" y="211" text-anchor="end">✗ 삭제</text>
  <text class="d-muted d-accent" x="253" y="250">기존 데이터 삭제</text>
  <text class="d-muted d-accent" x="253" y="272">다시 up: 새 볼륨 생성</text>
</svg>
