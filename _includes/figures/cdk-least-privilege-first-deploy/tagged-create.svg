<svg class="diagram-svg diagram-tall" viewBox="0 0 360 520" role="img" aria-labelledby="clp-tag-title clp-tag-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="clp-tag-title">태그를 단 CreateGateway 요청 하나가 확인받는 두 권한</title>
  <desc id="clp-tag-desc">CloudFormation이 CreateGateway 요청을 보낸다. 요청에는 내가 정한 태그 project와 phase, 그리고 CloudFormation이 스스로 넣는 aws:cloudformation 스택 태그 셋이 실린다. 이 요청 하나로 두 권한을 확인받는다. CreateGateway는 자원 * 에 대해 확인받고, 리전과 요청 태그 조건이 있는 만들기 문장이 허용해 통과했다. TagResource는 아직 ID가 없는 gateway/* 자원에 대해 확인받는데, 허용이 이름 ARN 문장에만 있어 거부됐다. 만들기 문장에 TagResource를 더해 재배포가 성공했다.</desc>
  <rect class="d-box" x="20" y="8" width="320" height="120"/>
  <text class="d-strong" x="180" y="36" text-anchor="middle">CloudFormation</text>
  <text class="d-mono" x="180" y="62" text-anchor="middle">CreateGateway 요청</text>
  <text x="180" y="88" text-anchor="middle">내 태그 <tspan class="d-mono">project</tspan> · <tspan class="d-mono">phase</tspan></text>
  <text class="d-muted" x="180" y="112" text-anchor="middle">+ <tspan class="d-mono">aws:cloudformation:*</tspan> 셋 (자동)</text>

  <path class="d-line" d="M180 128 V150"/>
  <text class="d-strong" x="180" y="174" text-anchor="middle">한 요청, 두 권한 확인</text>
  <path class="d-line" d="M90 184 V204 M270 184 V204 M90 184 H270"/>
  <path class="d-line" d="M85 198 L90 204 L95 198 M265 198 L270 204 L275 198"/>

  <rect class="d-box" x="8" y="204" width="164" height="132"/>
  <text class="d-mono d-strong" x="90" y="232" text-anchor="middle">CreateGateway</text>
  <text class="d-muted" x="90" y="258" text-anchor="middle">자원 <tspan class="d-mono">*</tspan></text>
  <text x="90" y="290" text-anchor="middle">만들기 문장</text>
  <text x="90" y="314" text-anchor="middle">✓ 허용</text>

  <rect class="d-box" x="188" y="204" width="164" height="132"/>
  <text class="d-mono d-strong" x="270" y="232" text-anchor="middle">TagResource</text>
  <text class="d-muted" x="270" y="258" text-anchor="middle">자원 <tspan class="d-mono">gateway/*</tspan></text>
  <text class="d-muted" x="270" y="280" text-anchor="middle">(아직 ID 없음)</text>
  <text class="d-accent" x="270" y="304" text-anchor="middle">✗ 이름 ARN에만</text>
  <text class="d-accent" x="270" y="326" text-anchor="middle">허용이 있었다</text>

  <path class="d-line" d="M270 336 V380"/>
  <path class="d-line" d="M265 374 L270 380 L275 374"/>
  <rect class="d-box" x="20" y="380" width="320" height="132"/>
  <text class="d-strong" x="180" y="408" text-anchor="middle">고침</text>
  <text x="180" y="434" text-anchor="middle">만들기 문장에 <tspan class="d-mono">TagResource</tspan> 추가</text>
  <text class="d-muted" x="180" y="460" text-anchor="middle">조건: 리전 · 요청 태그 <tspan class="d-mono">project</tspan> · <tspan class="d-mono">phase</tspan></text>
  <text x="180" y="494" text-anchor="middle">✓ 재배포 성공</text>
</svg>
