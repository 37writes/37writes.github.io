<svg class="diagram-svg diagram-tall" viewBox="0 0 360 720" role="img" aria-labelledby="dtls-layers-title dtls-layers-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="dtls-layers-title">WebRTC 보안의 두 층: 시그널링으로 지문을 건네고 미디어 길에서 DTLS로 확인한 뒤 SRTP로 보낸다</title>
  <desc id="dtls-layers-desc">위쪽은 시그널링 층이다. 뷰어와 마스터는 KVS 신호 채널의 서명된 WSS로 offer와 answer SDP를 주고받는다. SDP에는 a=setup 줄과 a=fingerprint:sha-256 줄이 들어 있다. a=setup은 offer에서 actpass이고, answer는 active나 passive 중에 고른다. 각자 자기 인증서의 지문을 미리 건넨다. 받은 쪽은 이 지문을 기억해 둔다. 아래쪽은 미디어 층이다. STUN, DTLS, SRTP가 UDP 한 포트를 같이 쓴다. 1단계로 ICE가 STUN 요청과 응답으로 길이 열렸는지 확인한다. 2단계로 DTLS 핸드셰이크를 하며, 상대가 보낸 인증서의 해시가 시그널링으로 받은 지문과 같은지 본다. 다르면 연결을 끊는다. 3단계로 핸드셰이크 결과에서 EXTRACTOR-dtls_srtp 라벨로 SRTP 키를 꺼낸다. 4단계로 영상과 소리는 DTLS 틀에 싸지 않고 SRTP 패킷으로 바로 보낸다. 미디어에 대해 DTLS는 상대 확인과 SRTP 키 수립을 맡고, 영상은 SRTP가 나른다. 데이터 채널은 이 그림에 없다.</desc>

  <text class="d-strong" x="16" y="30">시그널링 층</text>
  <text class="d-muted" x="16" y="52">KVS 신호 채널 · 서명된 WSS</text>
  <rect class="d-box" x="16" y="64" width="328" height="152" rx="8"/>
  <text x="32" y="94">offer / answer SDP를 주고받음</text>
  <text x="32" y="124"><tspan class="d-muted">offer 예</tspan> <tspan class="d-mono">a=setup:actpass</tspan></text>
  <text class="d-mono" x="32" y="150">a=fingerprint:sha-256</text>
  <text class="d-mono" x="32" y="174">01:56:…:DF:12</text>
  <text class="d-muted" x="32" y="202">내 인증서 지문을 미리 건넨다</text>

  <path class="d-line" d="M180 216 V262"/>
  <path class="d-line" d="M174 256 L180 262 L186 256"/>
  <text class="d-muted" x="194" y="244">받은 지문을 기억</text>

  <text class="d-strong" x="16" y="292">미디어 층</text>
  <text class="d-muted" x="16" y="314">UDP 한 포트 · STUN, DTLS, SRTP</text>

  <rect class="d-box" x="16" y="326" width="328" height="58" rx="8"/>
  <text x="32" y="350" font-weight="700">① ICE 연결 확인</text>
  <text class="d-muted" x="32" y="373">STUN 요청·응답으로 길 확인</text>

  <path class="d-line" d="M180 384 V404"/>
  <path class="d-line" d="M174 398 L180 404 L186 398"/>

  <rect class="d-line" x="16" y="404" width="328" height="86" rx="8"/>
  <text x="32" y="430" font-weight="700">② DTLS 핸드셰이크</text>
  <text class="d-accent" x="32" y="455">인증서 해시 = 받은 지문?</text>
  <text class="d-muted" x="32" y="478">다르면 연결을 끊는다</text>

  <path class="d-line" d="M180 490 V510"/>
  <path class="d-line" d="M174 504 L180 510 L186 504"/>

  <rect class="d-box" x="16" y="510" width="328" height="58" rx="8"/>
  <text x="32" y="534" font-weight="700">③ SRTP 키 꺼내기</text>
  <text class="d-mono" x="32" y="557">EXTRACTOR-dtls_srtp</text>

  <path class="d-line" d="M180 568 V588"/>
  <path class="d-line" d="M174 582 L180 588 L186 582"/>

  <rect class="d-box" x="16" y="588" width="328" height="58" rx="8"/>
  <text x="32" y="612" font-weight="700">④ SRTP 영상·소리</text>
  <text class="d-muted" x="32" y="635">DTLS 틀 없이 바로 보낸다</text>

  <text class="d-muted" x="180" y="688" text-anchor="middle">미디어: DTLS는 인증·키, 영상은 SRTP</text>
</svg>
