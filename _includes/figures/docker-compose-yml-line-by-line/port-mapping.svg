  <text x="180" y="292" text-anchor="middle">✗ 닿지 않음 (Docker 28 이상)</text>

  <rect class="d-line" x="12" y="344" width="336" height="256" rx="6"/>
  <text class="d-mono" x="180" y="374" text-anchor="middle">3000:8080</text>
  <text class="d-strong d-accent" x="180" y="408" text-anchor="middle">! 기본: 모든 주소 공개</text>
  <rect class="d-box" x="24" y="424" width="312" height="56" rx="4"/>
  <text class="d-muted" x="180" y="447" text-anchor="middle">이 PC의 브라우저</text>
  <text class="d-muted" x="180" y="470" text-anchor="middle">앱이 준비되면 접속 가능</text>
  <rect class="d-box" x="24" y="490" width="312" height="90" rx="4"/>
  <text class="d-muted" x="180" y="513" text-anchor="middle">다른 PC</text>
  <text class="d-accent" x="180" y="538" text-anchor="middle">! 네트워크에서 닿고</text>
  <text class="d-accent" x="180" y="562" text-anchor="middle">방화벽이 허용하면 접속 가능</text>
</svg>
