  <rect class="d-box" x="146" y="12" width="88" height="44" rx="4"/>
  <text class="d-mono" x="190" y="39" text-anchor="middle">3000</text>
  <text class="d-muted" x="190" y="78" text-anchor="middle">PC 포트</text>
  <rect class="d-box" x="244" y="12" width="104" height="44" rx="4"/>
  <text class="d-mono" x="296" y="39" text-anchor="middle">8080</text>
  <text class="d-muted" x="296" y="78" text-anchor="middle">컨테이너 포트</text>
  <text class="d-mono" x="141" y="39" text-anchor="middle">:</text>
  <text class="d-mono" x="239" y="39" text-anchor="middle">:</text>

  <rect class="d-line" x="12" y="100" width="336" height="222" rx="6"/>
  <text class="d-mono" x="180" y="130" text-anchor="middle">127.0.0.1:3000:8080</text>
  <text class="d-strong" x="180" y="164" text-anchor="middle">✓ 이 PC에서만</text>
  <rect class="d-box" x="24" y="180" width="312" height="56" rx="4"/>
  <text class="d-muted" x="180" y="203" text-anchor="middle">이 PC의 브라우저</text>
  <text class="d-muted" x="180" y="226" text-anchor="middle">앱이 준비되면 접속 가능</text>
