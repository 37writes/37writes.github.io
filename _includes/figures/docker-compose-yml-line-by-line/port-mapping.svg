  <rect class="d-box" x="244" y="12" width="104" height="44" rx="4"/>
  <text class="d-mono" x="296" y="39" text-anchor="middle">8080</text>
  <text class="d-muted" x="296" y="78" text-anchor="middle">컨테이너</text>
  <text class="d-mono" x="141" y="39" text-anchor="middle">:</text>
  <text class="d-mono" x="239" y="39" text-anchor="middle">:</text>

  <rect class="d-line" x="12" y="100" width="336" height="222" rx="6"/>
  <text class="d-mono" x="180" y="130" text-anchor="middle">127.0.0.1:3000:8080</text>
  <text class="d-strong" x="180" y="164" text-anchor="middle">✓ 이 PC에서만</text>
  <rect class="d-box" x="24" y="180" width="312" height="56" rx="4"/>
  <text class="d-muted" x="180" y="203" text-anchor="middle">이 PC의 브라우저</text>
  <text x="180" y="226" text-anchor="middle">✓ 접속됨</text>
  <rect class="d-box" x="24" y="246" width="312" height="56" rx="4"/>
  <text class="d-muted" x="180" y="269" text-anchor="middle">다른 PC</text>
  <text x="180" y="292" text-anchor="middle">✗ 닿지 않음</text>

  <rect class="d-line" x="12" y="344" width="336" height="222" rx="6"/>
  <text class="d-mono" x="180" y="374" text-anchor="middle">3000:8080</text>
  <text class="d-strong d-accent" x="180" y="408" text-anchor="middle">! 모든 주소에 공개</text>
  <rect class="d-box" x="24" y="424" width="312" height="56" rx="4"/>
  <text class="d-muted" x="180" y="447" text-anchor="middle">이 PC의 브라우저</text>
  <text x="180" y="470" text-anchor="middle">✓ 접속됨</text>
  <rect class="d-box" x="24" y="490" width="312" height="56" rx="4"/>
  <text class="d-muted" x="180" y="513" text-anchor="middle">다른 PC</text>
  <text class="d-accent" x="180" y="536" text-anchor="middle">! 방화벽 설정에 달림</text>
</svg>
