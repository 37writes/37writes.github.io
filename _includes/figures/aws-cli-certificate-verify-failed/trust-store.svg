  <text class="d-strong" x="160" y="26" text-anchor="middle">사내 프록시가 내민 같은 인증서</text>
  <text class="d-muted" x="160" y="50" text-anchor="middle">사내 Root CA가 서명한 ‘AWS 인증서’</text>
  <path class="d-line" d="M12 68 H308"/>
  <text class="d-strong" x="12" y="98">브라우저</text>
  <text class="d-muted" x="12" y="120">Windows 인증서 저장소</text>
  <rect class="d-box" x="12" y="132" width="296" height="118"/>
  <text class="d-muted d-small" x="28" y="156">믿는 Root CA 일부</text>
  <text x="28" y="181">✓ Amazon</text>
  <text x="28" y="205">✓ DigiCert</text>
  <text x="28" y="229">✓ 사내 Root CA</text>
  <text class="d-strong" x="12" y="280">✓ 통과</text>
  <text class="d-muted" x="308" y="280" text-anchor="end">콘솔이 잘 열림</text>
  <text class="d-strong" x="12" y="324">AWS CLI</text>
  <text class="d-muted" x="12" y="346">자체 번들 (certifi)</text>
  <rect class="d-box" x="12" y="358" width="296" height="118"/>
  <text class="d-muted d-small" x="28" y="382">믿는 Root CA 일부</text>
  <text x="28" y="407">✓ Amazon</text>
  <text x="28" y="431">✓ DigiCert</text>
  <text class="d-accent" x="28" y="455">✗ 사내 Root CA 없음</text>
  <text class="d-strong d-accent" x="12" y="506">✗ 검증 실패</text>
  <text class="d-mono d-muted" x="12" y="530">CERTIFICATE_VERIFY_FAILED</text>
  <path class="d-line" d="M12 552 H308"/>
  <text x="12" y="582">해결: CLI의 <tspan class="d-mono">ca_bundle</tspan>에</text>
  <text x="12" y="606">사내 Root CA 파일 지정</text>
</svg>
